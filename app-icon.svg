<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glassmorphism Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F1E35;stop-opacity:1" />
    </linearGradient>
    
    <!-- Primary Blue Gradient for Symbol -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow Filter for Glassmorphism -->
    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Soft Blur for Glassmorphism Background -->
    <filter id="frostedGlass">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>
  </defs>
  
  <!-- Main Background -->
  <rect width="1024" height="1024" fill="url(#bgGradient)"/>
  
  <!-- Glassmorphism Background Circle (Subtle) -->
  <circle cx="512" cy="512" r="420" fill="rgba(255,255,255,0.05)" filter="url(#frostedGlass)"/>
  <circle cx="512" cy="512" r="420" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- First Wave/Communication Line (Left to Right, Top) -->
  <path d="M 250 520 Q 400 380 550 520 T 850 520" 
        stroke="url(#primaryGradient)" 
        stroke-width="32" 
        fill="none" 
        stroke-linecap="round"
        opacity="0.9"
        filter="url(#glowEffect)"/>
  
  <!-- Second Wave/Communication Line (Right to Left, Bottom) - Intersecting -->
  <path d="M 850 504 Q 700 640 550 504 T 250 504" 
        stroke="url(#primaryGradient)" 
        stroke-width="32" 
        fill="none" 
        stroke-linecap="round"
        opacity="0.85"
        filter="url(#glowEffect)"/>
  
  <!-- Central Intersection Circle (Glassmorphism Effect) -->
  <circle cx="512" cy="512" r="60" 
          fill="rgba(60, 130, 246, 0.15)" 
          stroke="url(#primaryGradient)" 
          stroke-width="3"
          filter="url(#glowEffect)"/>
  
  <!-- Inner Core Circle -->
  <circle cx="512" cy="512" r="45" 
          fill="rgba(60, 130, 246, 0.3)" 
          stroke="url(#primaryGradient)" 
          stroke-width="2"
          opacity="0.8"/>
  
  <!-- Accent Dots at Intersection Points -->
  <circle cx="380" cy="512" r="8" fill="url(#primaryGradient)" opacity="0.9" filter="url(#glowEffect)"/>
  <circle cx="644" cy="512" r="8" fill="url(#primaryGradient)" opacity="0.9" filter="url(#glowEffect)"/>
  
  <!-- Top Accent Point -->
  <circle cx="512" cy="380" r="6" fill="url(#primaryGradient)" opacity="0.7" filter="url(#glowEffect)"/>
  
  <!-- Bottom Accent Point -->
  <circle cx="512" cy="644" r="6" fill="url(#primaryGradient)" opacity="0.7" filter="url(#glowEffect)"/>
  
  <!-- Subtle Outer Ring for Depth -->
  <circle cx="512" cy="512" r="480" 
          fill="none" 
          stroke="rgba(96, 165, 250, 0.08)" 
          stroke-width="1"
          opacity="0.6"/>
  
  <!-- Glassmorphism Highlight Effect (Top Left) -->
  <ellipse cx="380" cy="350" rx="150" ry="100" 
           fill="rgba(255,255,255,0.08)" 
           opacity="0.5"
           filter="url(#frostedGlass)"/>
  
  <!-- Corner Accent Lines (Subtle Futuristic Feel) -->
  <line x1="200" y1="200" x2="280" y2="200" 
        stroke="rgba(60, 130, 246, 0.2)" 
        stroke-width="2" 
        stroke-linecap="round"
        opacity="0.6"/>
  
  <line x1="200" y1="200" x2="200" y2="280" 
        stroke="rgba(60, 130, 246, 0.2)" 
        stroke-width="2" 
        stroke-linecap="round"
        opacity="0.6"/>
  
  <line x1="824" y1="824" x2="744" y2="824" 
        stroke="rgba(60, 130, 246, 0.2)" 
        stroke-width="2" 
        stroke-linecap="round"
        opacity="0.6"/>
  
  <line x1="824" y1="824" x2="824" y2="744" 
        stroke="rgba(60, 130, 246, 0.2)" 
        stroke-width="2" 
        stroke-linecap="round"
        opacity="0.6"/>
</svg>
